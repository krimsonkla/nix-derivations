name: publish
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    # The write token is an ENVIRONMENT secret, and the environment's
    # deployment-branch policy admits only the default branch. That, not the
    # `on: push: branches` filter, is what keeps a feature branch or a fork
    # from ever holding the token.
    environment: cachix-push
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Bounded like check.yml's consumer job: a hung build must not hold the
    # write-token job for the six-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: sandbox = true
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: krimsonkla-nixpkgs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build every package
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          attrs=$(nix eval --raw ".#packages.$system" --apply 'ps: builtins.concatStringsSep " " (map (n: ".#" + n) (builtins.attrNames ps))')
          # shellcheck disable=SC2086
          nix build --print-build-logs $attrs
      # The same packages built against each registered consumer nixpkgs, so a
      # consumer that follows its own nixpkgs finds them in the cache. The
      # cachix-action push hook uploads them like the builds above. A
      # provenance failure here is re-run, never bypassed.
      - name: Validate the consumer list and check each rev comes from upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/consumer-nixpkgs.py provenance consumer-nixpkgs.txt > "$RUNNER_TEMP/consumer-refs"
      - name: Build every package per consumer nixpkgs
        run: bash scripts/build-consumer-nixpkgs.sh "$RUNNER_TEMP/consumer-refs"
  substitute-only:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Bounded like check.yml's consumer job: a hung build must not hold the
    # write-token job for the six-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            substituters = https://krimsonkla-nixpkgs.cachix.org https://cache.nixos.org
            trusted-public-keys = krimsonkla-nixpkgs.cachix.org-1:9WHsyDVPF07aDDPjysKKmovp4LxPztFlSPV2Vj0lZgk= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - name: Assert the restricted settings took effect
        # Presence checks rather than byte-exact lines: the installer may
        # append to Nix's defaults, so order and duplicates vary. The last
        # check is the load-bearing one: no substituter other than the two
        # allowed hosts may be present, or the proof is weaker than claimed.
        run: |
          subs=$(nix config show | sed -nE 's/^substituters = //p')
          keys=$(nix config show | sed -nE 's/^trusted-public-keys = //p')
          echo "substituters: $subs"; echo "trusted-public-keys: $keys"
          grep -qF 'https://krimsonkla-nixpkgs.cachix.org' <<<"$subs"
          grep -qF 'krimsonkla-nixpkgs.cachix.org-1:9WHsyDVPF07aDDPjysKKmovp4LxPztFlSPV2Vj0lZgk=' <<<"$keys"
          ! tr ' ' '\n' <<<"$subs" | grep -vE '^(https://krimsonkla-nixpkgs\.cachix\.org/?|https://cache\.nixos\.org/?)$' | grep -q .
      - name: Substitute every package with local builds forbidden
        # devenv-nixpkgs applies its patches at evaluation time, which is a
        # build Nix must be allowed to do. So the attribute list is evaluated
        # first under normal settings, and only the package build runs with
        # --max-jobs 0: any package output that is not in the cache is then an
        # error, which is the proof this job exists to give.
        run: |
          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          attrs=$(nix eval --raw ".#packages.$system" --apply 'ps: builtins.concatStringsSep " " (map (n: ".#" + n) (builtins.attrNames ps))')
          echo "packages: $attrs"
          # Force full instantiation now: attribute names alone are answered
          # lazily without importing nixpkgs, so the patch derivation would
          # otherwise be realised inside the --max-jobs 0 build and fail it.
          nix eval --raw ".#packages.$system" --apply 'ps: builtins.concatStringsSep "\n" (map (n: ps.${n}.drvPath) (builtins.attrNames ps))'
          echo
          # shellcheck disable=SC2086
          nix build --max-jobs 0 --print-build-logs $attrs
      - name: Validate the consumer list and check each rev comes from upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/consumer-nixpkgs.py provenance consumer-nixpkgs.txt > "$RUNNER_TEMP/consumer-refs"
      - name: Substitute every package per consumer nixpkgs with local builds forbidden
        run: bash scripts/build-consumer-nixpkgs.sh --substitute-only "$RUNNER_TEMP/consumer-refs"
