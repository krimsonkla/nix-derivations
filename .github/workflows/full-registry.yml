name: full-registry
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pkgs/**, tests/**]
permissions:
  contents: read
jobs:
  rebuild-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: sandbox = true
      # The all-zero base forces mode=all, so this lane reuses the same script.
      - run: nix develop -c bash scripts/registry-diff.sh 0000000000000000000000000000000000000000 ${{ github.sha }}
